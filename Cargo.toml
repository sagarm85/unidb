[workspace]
members = ["unidb-attach", "unidb-embed", "loom-crabbing", "unidb-dispatch", "unidb-storage", "unidb-logical", "unidb-server-full"]
resolver = "2"

[package]
name = "unidb"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
crc32fast = "1.4"
zerocopy = { version = "0.7", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlparser = "0.62.0"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
instant-distance = "0.6.1"
# Item 95: per-engine graph adjacency cache (hot-hub lazy warm cache).
# DashMap provides fine-grained sharded concurrent access without a coarse Mutex.
dashmap = "6"
# Item 121 (Workstream A, A1): argon2id password hashing for the credential
# store in `src/authz/mod.rs`. Not server-feature-gated — `CREATE USER ...
# PASSWORD` DDL is parsed by the core (embedded) authz module, independent of
# the optional HTTP server. Re-exports the `password_hash` crate (PHC string
# format, `SaltString`, `OsRng`) so no separate dependency is needed.
argon2 = "0.5"
# Item 121 (Workstream A, A4): fast one-way hashing for opaque refresh-token
# sessions in `src/authz/mod.rs`. Refresh tokens are already 256-bit CSPRNG
# output (see `generate_refresh_token`), so a slow KDF like argon2id buys no
# extra brute-force resistance here and would needlessly cost every refresh
# call — SHA-256 is the right tool for hashing an already-high-entropy secret
# (same rationale most API-key/session-token stores use, e.g. hashing a PAT).
sha2 = "0.10"

# Workstream D4 (item 127): TOTP-based MFA (RFC 6238) — HMAC-SHA1 + a small
# hand-rolled base32/HOTP layer in `src/authz/mod.rs`. Not server-feature-
# gated, same rationale as `argon2`/`sha2` above: MFA state (secret, recovery
# codes) is core `authz::RoleStore` state, independent of the optional HTTP
# server. Both crates already resolve in `Cargo.lock` (transitive deps of the
# existing `jsonwebtoken`/`ring` dependency chain via `rfc6979`), so this adds
# no new supply-chain surface beyond making them direct dependencies.
hmac = "0.13"
sha1 = "0.11"

# M5: optional server (src/server/, src/bin/unidb-server.rs). All gated
# behind the `server` feature so a default `cargo build`/`cargo test` never
# pulls in an async runtime — "the engine stays sync" (CLAUDE.md) is
# literally true for the default embedded build, not just true when the
# feature happens to be off.
tokio = { version = "1.52", optional = true, features = ["sync", "rt", "rt-multi-thread", "net", "macros", "time", "signal"] }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", optional = true, features = ["trace", "cors", "timeout"] }
# item 121, A6: "use_pem" enables DecodingKey::from_rsa_pem/from_ec_pem and
# EncodingKey::from_rsa_pem/from_ec_pem (RS256/ES256 asymmetric JWT), in
# addition to the existing HS256 "aws_lc_rs" shared-secret path.
jsonwebtoken = { version = "10", optional = true, default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true, default-features = false }
axum-prometheus = { version = "0.10", optional = true }
async-stream = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
tracing-appender = { version = "0.2", optional = true }
# P6.f: native TLS termination for the server (rustls, no OpenSSL). Server-only.
axum-server = { version = "0.7", optional = true, features = ["tls-rustls"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs"] }
# R4: `POST /rows/batch` carries opaque row bytes as base64 in JSON. Server-only.
base64 = { version = "0.22", optional = true }
# Item 123 (Workstream C1): parses `/rest/v1/<table>` query strings
# (`col=eq.val&select=...&order=...`) preserving repeated keys, which axum's
# `Query<HashMap<_,_>>`/`serde` extractors can't (a `HashMap` collapses
# duplicate keys). Already a transitive dependency of `axum`/`serde_urlencoded`
# (see `Cargo.lock`), so this adds no new supply-chain surface — just exposes
# it directly to `server::rest_resource`. Server-only.
form_urlencoded = { version = "1", optional = true }
# Item 128 (Workstream D1): OAuth 2.0 social login — outbound HTTPS calls
# (token exchange, userinfo fetch) to Google/GitHub (or, in tests, a local
# mock provider). Previously a dev-dependency only (Postgres-baseline/
# bench-support HTTP calls); promoted to an optional, server-feature-gated
# *runtime* dependency here — same version/feature set as the existing
# dev-dependency entry below (rustls-tls, no native-tls/OpenSSL), so the two
# declarations resolve identically rather than pulling in two configurations
# of the same crate.
reqwest = { version = "0.12", optional = true, features = ["json", "stream", "rustls-tls"] }

[features]
server = [
    "dep:tokio", "dep:axum", "dep:tower", "dep:tower-http",
    "dep:jsonwebtoken", "dep:metrics", "dep:metrics-exporter-prometheus",
    "dep:axum-prometheus", "dep:async-stream", "dep:futures-util",
    "dep:tracing-appender", "dep:axum-server", "dep:rustls", "dep:base64",
    "dep:form_urlencoded", "dep:reqwest",
    # Item 22, L1: JSON-lines log formatting. Enabled only under `server` so the
    # default embedded build's `tracing-subscriber` stays minimal (the `json`
    # feature just pulls serde_json — already present — into the subscriber).
    "tracing-subscriber/json",
]

[dev-dependencies]
# Item 31: storage HTTP routes integration tests. unidb-storage depends on
# unidb, so placing it in [dependencies] would create a cycle. In dev-
# dependencies Cargo allows this cross-reference: the test binary links to
# both without a cycle in the normal-edge graph.
unidb-storage = { path = "unidb-storage" }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# Also declared above as an optional, server-feature-gated *runtime*
# dependency (item 128, OAuth). Kept here too (unconditional) so bench/test
# code that isn't built with `--features server` (e.g. `benches/decompose.rs`'s
# Postgres-baseline HTTP calls) still gets it without needing the feature on.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
futures-util = "0.3"
# Phase 4 differential correctness: join/aggregate/subquery results are checked
# against SQLite on the same data. `bundled` compiles its own SQLite C library
# so the tests are self-contained and reproducible in CI. Dev-dependency only —
# it never enters the engine's own dependency graph, so the "engine stays sync"
# invariant (`cargo tree -p unidb --no-default-features --edges normal`) holds.
rusqlite = { version = "0.32", features = ["bundled"] }
# P6.f: generate a self-signed cert in the TLS integration test (dev-only).
rcgen = "0.13"
# R4: encode raw row payloads in the /rows/batch integration tests (dev-only;
# the server itself gets it via the optional feature-gated dependency above).
base64 = "0.22"
# Postgres baseline comparison (benches/decompose.rs, PG_URL-gated). Sync
# client, dev-dependency ONLY (same precedent as rusqlite/reqwest) — it never
# enters the engine's normal-edge graph, so the "engine stays sync" invariant
# (`cargo tree -p unidb --no-default-features --edges normal`) still holds.
postgres = "0.19"
# Item 61: true replaced-stack benchmark — Redpanda (Kafka-compatible, no JVM)
# as the event-queue leg of the four-system comparison. `rskafka` is pure Rust
# (no librdkafka), async (needs tokio at bench time), gated on
# `MM_REPLACED_STACK_REALISTIC=1` + `REDPANDA_ADDR` at runtime — skips
# cleanly when Redpanda is unreachable, exactly like `PG_URL` unset.
# `chrono` supplies `Utc::now()` for rskafka Record timestamps.
# tokio is already an optional normal dep (server feature); adding it to
# dev-deps activates `rt` + `rt-multi-thread` for bench-time use without
# touching the library's sync-only normal-edge graph.
rskafka = { version = "0.6", default-features = false }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }


[[bin]]
name = "unidb-server"
path = "src/bin/unidb-server.rs"
required-features = ["server"]

# Item 126 (Workstream I4): schema-migrations CLI. Deliberately NOT gated on
# the "server" feature — it only opens the (sync) embedded `Engine` and calls
# `Engine::apply_migrations`, no async runtime/HTTP needed, so `cargo build`
# with default features already builds it.
[[bin]]
name = "unidb-migrate"
path = "src/bin/unidb-migrate.rs"

